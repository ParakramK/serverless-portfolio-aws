<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Blog | Student ID: Parakram Kharel</title>
    <script
        src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.1/dist/amazon-cognito-identity.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 800px;
            line-height: 1.6;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .hidden {
            display: none;
        }

        input,
        textarea {
            margin-bottom: 10px;
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background: #0066cc;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #004499;
        }
    </style>
</head>

<body>

    <header>
        <h1>Portfolio & Serverless Blog</h1>
        <p><strong>Student ID:</strong> Parakram Kharel</p>
    </header>

    <section id="auth">
        <h2>Admin Authentication</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="auth-status"></p>
    </section>

    <section id="create-post-sec" class="hidden">
        <h2>Create Blog Post</h2>
        <input type="text" id="title" placeholder="Post Title">
        <textarea id="content" placeholder="Post Content"></textarea>
        <button onclick="createPost()">Publish Post</button>
    </section>

    <section>
        <h2>Public Blog Posts</h2>
        <div id="posts-container">Loading posts...</div>
    </section>

    <script src="app.js"></script>
</body>

</html>
